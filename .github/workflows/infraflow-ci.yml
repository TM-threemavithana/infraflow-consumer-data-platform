name: "Data Platform CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "infraflow.config.yaml"
      - ".github/workflows/infraflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-gate:
    name: "InfraFlow Governance Gate"
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-governance.yml@1630e61952c99460b37eb775c11b190d0e1ab81f
    with:
      config-file: "infraflow.config.yaml"
      working-directory: "."
      platform-sha: "1630e61952c99460b37eb775c11b190d0e1ab81f"
      expected-adapter: "gcp"

  gcp-speculative-plan:
    name: "GCP Speculative Plan (Cloud-Free)"
    needs: [governance-gate]
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-gcp.yml@1630e61952c99460b37eb775c11b190d0e1ab81f
    with:
      gcp-project-id: "infraflow-data-dev-01"
      gcp-region: "us-central1"
      backend-bucket: "gcs-data-infraflow-tfstate"
      backend-prefix: "env/dev"
      terraform-version: "1.10.4"
      working-directory: "terraform"
      environment: "dev"
      enable-gcp-auth: false
